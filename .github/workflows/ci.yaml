# .github/workflows/ci.yml

name: CI
permissions:
  contents: read

on:
  push:
    branches: [main, dev, "feature/*"]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml,**/*.lock"

      - name: Lint
        run: uv tool install ruff && uv tool run ruff check huawei_solar_modbus_mqtt/bridge tests/

      - name: Format check
        run: uv tool run ruff format --check huawei_solar_modbus_mqtt/bridge tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml,**/*.lock"

      - name: Install project + dev deps
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -v --cov=bridge --cov-report=xml --cov-report=term -p no:socket

      - name: Check for Python changes
        id: python_changes
        if: matrix.python-version == '3.12'
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(py)$'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage (Python 3.12 only)
        if: matrix.python-version == '3.12' && steps.python_changes.outputs.changed == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          flags: unittests
          disable_search: true

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml,**/*.lock"

      - name: Install + Typecheck
        run: |
          uv sync --dev
          uv run mypy huawei_solar_modbus_mqtt/bridge --ignore-missing-imports
        continue-on-error: true

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml,**/*.lock"

      - name: Validate config.yaml
        run: |
          uv sync --dev
          uv run python -c "
          import yaml
          with open('huawei_solar_modbus_mqtt/config.yaml') as f:
              config = yaml.safe_load(f)
              assert 'version' in config
              assert 'name' in config
              print(f'✅ Config valid: {config[\"name\"]} v{config[\"version\"]}')
          "

  test-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck run.sh
        run: shellcheck huawei_solar_modbus_mqtt/run.sh

      - name: Validate run.sh syntax
        run: bash -n huawei_solar_modbus_mqtt/run.sh

  test-bash-advanced:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run BATS tests
        run: bats tests/test_run.bats -t

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate requirements.txt for Docker
        run: uv export --no-dev --no-hashes --no-emit-project -o huawei_solar_modbus_mqtt/requirements.txt

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./huawei_solar_modbus_mqtt
          push: false
          load: true
          tags: huabus-test:latest
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image structure
        run: |
          docker run --rm huabus-test:latest python3 --version
          echo "✅ Docker image builds successfully"

  ci-success:
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        test,
        type-check,
        validate-config,
        test-bash,
        test-bash-advanced,
        test-docker,
      ]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.validate-config.result }}" != "success" ]] || \
             [[ "${{ needs.test-bash.result }}" != "success" ]] || \
             [[ "${{ needs.test-bash-advanced.result }}" != "success" ]] || \
             [[ "${{ needs.test-docker.result }}" != "success" ]]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
