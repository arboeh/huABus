repos:
  # Ruff - Linter & Formatter (Python only)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(huawei_solar_modbus_mqtt/bridge|tests)/.*\.py$
      - id: ruff-format
        files: ^(huawei_solar_modbus_mqtt/bridge|tests)/.*\.py$

  # MyPy - Type Checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --check-untyped-defs]
        additional_dependencies: ["paho-mqtt>=2.1,<2.2", types-PyYAML]
        files: ^(huawei_solar_modbus_mqtt/bridge|tests)/.*\.py$

  # Pre-Commit Hooks - Standard Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Local Hooks
  - repo: local
    hooks:
      - id: check-version-sync
        name: Check version synchronization
        entry: python scripts/check_version_sync.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-dependency-sync
        name: Check dependency synchronization
        entry: python scripts/check_dependency_sync.py
        language: python
        additional_dependencies: [packaging]
        pass_filenames: false
        files: ^(pyproject\.toml|huawei_solar_modbus_mqtt/requirements\.txt)$
        stages: [pre-commit]

      - id: sync-version
        name: Sync version from config.yaml
        entry: python scripts/update_version.py
        language: python
        pass_filenames: false
        stages: [manual]
